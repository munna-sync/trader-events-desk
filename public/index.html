<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Trading, fintech, trade and business events with times in BDST and UTC.">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Trader Events Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@85,600;85,700;100,500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: a trading-desk calendar. Live BDST/UTC clocks in the header, a sticky rail with
   timeframe tabs + My Plan, filters on the left, event tickets in the main column. Dark-first. */
:root {
  --bg: #0c1018; --surface: #131926; --raise: #1a2232; --line: #263043; --fg: #e9edf4; --muted: #8f9bb0;
  --accent: #e8b04a; --accent-soft: #2e2615; --on-accent: #1a1204;
  --ok: #57cf93; --ok-bg: #11291d; --info: #5fc8d8; --info-bg: #0f2a30; --plan: #8fa6ff; --plan-bg: #1b2447;
  --bad: #ff8a80; --bad-bg: #3a1614; --neutral: #aab3c4; --neutral-bg: #222b3c; --violet: #c49bff; --violet-bg: #2a1f43;
  --font-display: "Archivo", "Arial Narrow", Arial, sans-serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) {
  --bg: #f3f5f9; --surface: #ffffff; --raise: #eef1f6; --line: #d8dee8; --fg: #121826; --muted: #586377;
  --accent: #9a6700; --accent-soft: #f6ecd6; --on-accent: #ffffff;
  --ok: #137a49; --ok-bg: #dcf3e6; --info: #0d7486; --info-bg: #daf2f6; --plan: #3550c9; --plan-bg: #e2e8ff;
  --bad: #b3261e; --bad-bg: #fbe1de; --neutral: #4a5468; --neutral-bg: #e6e9ef; --violet: #6a3fc0; --violet-bg: #eee6fb;
  color-scheme: light; } }
:root[data-theme="light"] {
  --bg: #f3f5f9; --surface: #ffffff; --raise: #eef1f6; --line: #d8dee8; --fg: #121826; --muted: #586377;
  --accent: #9a6700; --accent-soft: #f6ecd6; --on-accent: #ffffff;
  --ok: #137a49; --ok-bg: #dcf3e6; --info: #0d7486; --info-bg: #daf2f6; --plan: #3550c9; --plan-bg: #e2e8ff;
  --bad: #b3261e; --bad-bg: #fbe1de; --neutral: #4a5468; --neutral-bg: #e6e9ef; --violet: #6a3fc0; --violet-bg: #eee6fb;
  color-scheme: light; }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font: 15px/1.5 var(--font-body); }
a { color: var(--accent); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 1260px; margin: 0 auto; padding-inline: 20px; }
@media (max-width: 520px) { .wrap { padding-inline: 16px; } }

.top { padding-block: 20px 14px; display: flex; flex-wrap: wrap; gap: 14px 24px; align-items: center; justify-content: space-between; }
.brand h1 { margin: 0; font: 700 clamp(26px, 4.2vw, 36px)/1 var(--font-display); font-stretch: 85%; letter-spacing: -0.01em; text-transform: uppercase; }
.brand h1 em { font-style: normal; color: var(--accent); }
.brand p { margin: 6px 0 0; color: var(--muted); font-size: 14px; }
.clocks { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.clock { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 6px 12px; display: flex; flex-direction: column; min-width: 104px; }
.clock span { font: 600 10px var(--font-mono); letter-spacing: .12em; color: var(--muted); }
.clock b { font: 600 20px/1.1 var(--font-mono); font-variant-numeric: tabular-nums; }
.clock.bd b { color: var(--accent); }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 8px 14px; cursor: pointer; font-weight: 600; font-size: 14px; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.ghost { background: transparent; }
.btn.danger { color: var(--bad); }
.btn.small { padding: 5px 10px; font-size: 13px; }

.rail { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); }
.rail-inner { display: flex; gap: 12px; align-items: center; padding-block: 10px; flex-wrap: wrap; }
.tabs { display: flex; gap: 4px; background: var(--raise); padding: 4px; border-radius: 10px; overflow-x: auto; max-width: 100%; }
.tab { border: 0; background: transparent; padding: 7px 12px; border-radius: 7px; cursor: pointer; white-space: nowrap; font-weight: 600; font-size: 14px; color: var(--muted); display: flex; gap: 8px; align-items: baseline; }
.tab .n { font: 600 12px var(--font-mono); font-variant-numeric: tabular-nums; }
.tab[aria-selected="true"] { background: var(--surface); color: var(--fg); box-shadow: 0 1px 2px rgb(0 0 0 / .2); }
.tab[aria-selected="true"] .n { color: var(--accent); }
.tab.plan { color: var(--plan); }
.tab.plan[aria-selected="true"] { color: var(--fg); }
.tab.plan[aria-selected="true"] .n { color: var(--plan); }
.sep { width: 1px; align-self: stretch; background: var(--line); margin: 2px 2px; }
.search { flex: 1 1 240px; min-width: 0; position: relative; }
.search input { width: 100%; padding: 9px 12px 9px 34px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
.search svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); width: 15px; height: 15px; stroke: var(--muted); fill: none; stroke-width: 2; }

.layout { display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 28px; padding-block: 22px 60px; align-items: start; }
.layout.noside { grid-template-columns: minmax(0, 1fr); }
@media (max-width: 880px) { .layout { grid-template-columns: minmax(0, 1fr); gap: 16px; } }

.filters { position: sticky; top: 72px; max-height: calc(100vh - 88px); overflow: auto; display: flex; flex-direction: column; gap: 16px; padding-right: 4px; }
@media (max-width: 880px) { .filters { position: static; max-height: none; } .filters.collapsed { display: none; } }
.filters details { border-bottom: 1px solid var(--line); padding-bottom: 12px; }
.filters summary { list-style: none; cursor: pointer; display: flex; justify-content: space-between; font: 600 11px var(--font-mono); text-transform: uppercase; letter-spacing: .12em; color: var(--muted); }
.filters summary::-webkit-details-marker { display: none; }
.filters summary::after { content: "+"; }
.filters details[open] summary::after { content: "\2212"; }
.fbody { display: flex; flex-direction: column; gap: 3px; margin-top: 10px; }
.grp { font-size: 12px; font-weight: 600; margin: 8px 0 2px; }
.chk { display: flex; gap: 8px; align-items: flex-start; font-size: 14px; cursor: pointer; padding: 2px 0; }
.chk input { accent-color: var(--accent); margin-top: 3px; }
.chk .c { margin-left: auto; font: 500 12px var(--font-mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.mobile-only { display: none; }
@media (max-width: 880px) { .mobile-only { display: inline-flex; } }

.summary { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: baseline; justify-content: space-between; margin-bottom: 10px; }
.summary h2 { margin: 0; font: 700 22px var(--font-display); font-stretch: 85%; }
.summary .sub { color: var(--muted); font: 500 12px var(--font-mono); }
.month { display: flex; align-items: center; gap: 10px; margin: 24px 0 10px; }
.month:first-of-type { margin-top: 4px; }
.month h3 { font: 600 12px var(--font-mono); letter-spacing: .14em; text-transform: uppercase; margin: 0; color: var(--muted); }
.month::after { content: ""; flex: 1; border-top: 1px solid var(--line); }

.ev { display: grid; grid-template-columns: 70px minmax(0, 1fr) 168px; gap: 18px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px; margin-bottom: 10px; position: relative; }
.ev.pending { border-style: dashed; }
.ev.marked { border-color: color-mix(in srgb, var(--plan) 55%, var(--line)); }
.date { display: flex; flex-direction: column; align-items: center; gap: 2px; border-right: 1px solid var(--line); padding-right: 14px; }
.date .d { font: 600 32px/1 var(--font-mono); font-variant-numeric: tabular-nums; letter-spacing: -0.04em; }
.date .m { font: 600 11px var(--font-mono); letter-spacing: .16em; color: var(--accent); }
.date .ticker { margin-top: 8px; font: 600 10px var(--font-mono); letter-spacing: .08em; padding: 2px 6px; border-radius: 4px; background: var(--raise); color: var(--fg); }
.body { min-width: 0; display: flex; flex-direction: column; gap: 7px; }
.pills { display: flex; flex-wrap: wrap; gap: 6px; }
.pill { font: 600 11px var(--font-body); text-transform: uppercase; letter-spacing: .05em; padding: 3px 8px; border-radius: 5px; white-space: nowrap; }
.s-open { color: var(--ok); background: var(--ok-bg); }
.s-early { color: var(--info); background: var(--info-bg); }
.s-upcoming { color: var(--neutral); background: var(--neutral-bg); }
.s-app { color: var(--violet); background: var(--violet-bg); }
.s-sold { color: var(--bad); background: var(--bad-bg); }
.s-closed { color: var(--neutral); background: var(--neutral-bg); text-decoration: line-through; }
.p-virtual { color: var(--accent); background: var(--accent-soft); }
.p-format { color: var(--muted); border: 1px solid var(--line); }
.p-live { color: var(--on-accent); background: var(--accent); }
.p-pend { color: var(--accent); border: 1px dashed var(--accent); }
.ev h4 { margin: 0; font: 700 19px/1.2 var(--font-display); font-stretch: 85%; text-wrap: balance; }
.ev h4 button { all: unset; cursor: pointer; }
.ev h4 button:hover { color: var(--accent); text-decoration: underline; }
.ev h4 button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.org { margin: 0; color: var(--muted); font-size: 14px; }
.times { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; font: 500 13px var(--font-mono); font-variant-numeric: tabular-nums; background: var(--raise); border-radius: 7px; padding: 8px 10px; }
.times dt { color: var(--muted); font-weight: 600; letter-spacing: .06em; }
.times dt.bd { color: var(--accent); }
.times dd { margin: 0; min-width: 0; }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 6px 16px; font-size: 14px; margin: 0; }
.facts div { min-width: 0; }
.facts dt { font: 600 10px var(--font-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.facts dd { margin: 0; }
.desc { margin: 0; font-size: 14px; max-width: 72ch; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; padding: 0; margin: 2px 0 0; list-style: none; }
.tag { font-size: 12px; padding: 2px 9px; border-radius: 999px; background: var(--raise); border: 0; cursor: pointer; }
.tag:hover { background: var(--accent-soft); }
.actions { display: flex; flex-direction: column; gap: 8px; align-items: stretch; }
.count { font: 600 13px var(--font-mono); text-align: right; }
.count small { display: block; color: var(--muted); font-weight: 500; font-size: 11px; }
.mark { border: 1px solid var(--line); background: transparent; border-radius: 8px; padding: 7px 10px; cursor: pointer; font-weight: 600; font-size: 13px; display: flex; align-items: center; gap: 8px; justify-content: flex-start; }
.mark svg { width: 15px; height: 15px; flex: none; }
.mark[aria-pressed="true"] { background: var(--plan-bg); border-color: var(--plan); color: var(--plan); }
.mark.int[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.links { display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; font-size: 13px; font-weight: 600; }
.links button { background: none; border: 0; color: var(--accent); cursor: pointer; padding: 0; font-weight: 600; font-size: 13px; text-decoration: underline; }
@media (max-width: 760px) {
  .ev { grid-template-columns: 54px minmax(0, 1fr); padding: 14px; gap: 12px; }
  .date { padding-right: 10px; } .date .d { font-size: 24px; }
  .actions { grid-column: 1 / -1; display: grid; grid-template-columns: 1fr 1fr; border-top: 1px solid var(--line); padding-top: 10px; }
  .count { text-align: left; grid-column: 1 / -1; }
  .links { grid-column: 1 / -1; justify-content: flex-start; }
}

.empty { border: 1px dashed var(--line); border-radius: 10px; padding: 34px 24px; text-align: center; color: var(--muted); }
.empty strong { display: block; color: var(--fg); font: 700 18px var(--font-display); font-stretch: 85%; margin-bottom: 6px; }

/* My Plan */
.planhead { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; margin-bottom: 18px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
.stat span { font: 600 10px var(--font-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.stat b { display: block; font: 700 26px/1.1 var(--font-display); font-stretch: 85%; margin-top: 4px; }
.stat small { color: var(--muted); font-size: 13px; }
.note { font-size: 13px; color: var(--muted); margin: 0; }

/* Panels (detail + admin) */
.scrim { position: fixed; inset: 0; background: rgb(4 7 14 / .55); z-index: 20; }
.panel { position: fixed; top: 0; right: 0; bottom: 0; width: min(660px, 100%); background: var(--surface); z-index: 21; display: flex; flex-direction: column; border-left: 1px solid var(--line); padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
.phead { display: flex; justify-content: space-between; align-items: flex-start; padding: 16px 20px; border-bottom: 1px solid var(--line); gap: 12px; }
.phead h2 { margin: 0; font: 700 22px/1.15 var(--font-display); font-stretch: 85%; text-wrap: balance; }
.ptabs { display: flex; gap: 4px; padding: 8px 20px 0; border-bottom: 1px solid var(--line); overflow-x: auto; }
.ptab { border: 0; background: none; padding: 8px 12px; cursor: pointer; font-weight: 600; color: var(--muted); border-bottom: 2px solid transparent; white-space: nowrap; }
.ptab[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent); }
.pbody { overflow: auto; padding: 18px 20px 40px; flex: 1; display: flex; flex-direction: column; gap: 14px; }
.form { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.form .full { grid-column: 1 / -1; }
.form label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 600; min-width: 0; }
.form input, .form select, .form textarea { padding: 8px 10px; border: 1px solid var(--line); border-radius: 7px; background: var(--bg); font-weight: 400; min-width: 0; width: 100%; }
.form textarea { min-height: 92px; resize: vertical; }
@media (max-width: 520px) { .form { grid-template-columns: 1fr; } }
.catpick { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
.catgrid { display: flex; flex-wrap: wrap; gap: 6px; }
.catgrid label { flex-direction: row; font-weight: 400; gap: 6px; align-items: center; border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; cursor: pointer; font-size: 13px; }
.catgrid label:has(input:checked) { background: var(--accent-soft); border-color: var(--accent); }
.catgrid input { accent-color: var(--accent); margin: 0; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.msg { font-size: 13px; padding: 8px 12px; border-radius: 7px; margin: 0; }
.msg.ok { background: var(--ok-bg); color: var(--ok); }
.msg.err { background: var(--bad-bg); color: var(--bad); }
.qitem { border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; }
.qitem h5 { margin: 0; font: 700 16px var(--font-display); font-stretch: 85%; }
.qitem .meta { font: 500 12px var(--font-mono); color: var(--muted); }
textarea.feed { width: 100%; min-height: 170px; font: 13px/1.4 var(--font-mono); padding: 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); }
code { font-family: var(--font-mono); font-size: 12px; background: var(--raise); padding: 1px 5px; border-radius: 4px; }
@media (prefers-reduced-motion: no-preference) { .mark, .ev { transition: border-color .15s, background-color .15s; } }
</style>
</head>
<body>


<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1>Trader Events <em>Desk</em></h1>
      <p>Trading, fintech, trade and business events you can attend, with every time in BDST and UTC.</p>
    </div>
    <div class="clocks">
      <div class="clock bd" aria-label="Bangladesh time"><span>BDST · UTC+6</span><b id="clkBd">--:--</b></div>
      <div class="clock" aria-label="UTC time"><span>UTC</span><b id="clkUtc">--:--</b></div>
      <button class="btn mobile-only" id="filterToggle" type="button" aria-expanded="false">Filters</button>
      <button class="btn primary" id="adminBtn" type="button" hidden>Admin</button>
    </div>
  </header>
</div>

<div class="rail">
  <div class="wrap rail-inner">
    <div class="tabs" role="tablist" aria-label="Timeframe" id="tabs"></div>
    <div class="search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
      <input id="q" type="search" placeholder="Search events, cities, organisers" aria-label="Search events">
    </div>
  </div>
</div>

<div class="wrap layout" id="layout">
  <aside class="filters collapsed" id="filters" aria-label="Filters"></aside>
  <main id="main" aria-live="polite">
    <div class="empty"><strong>Loading events</strong>Connecting to the event database.</div>
  </main>
</div>

<div class="scrim" id="scrim" hidden></div>
<section class="panel" id="panel" hidden aria-label="Panel">
  <div class="phead"><h2 id="pTitle"></h2><button class="btn ghost small" id="closePanel" type="button">Close</button></div>
  <div class="ptabs" role="tablist" id="ptabs" hidden>
    <button class="ptab" role="tab" data-p="queue" type="button">Review queue</button>
    <button class="ptab" role="tab" data-p="edit" type="button">Add event</button>
    <button class="ptab" role="tab" data-p="import" type="button">Import feed</button>
    <button class="ptab" role="tab" data-p="runs" type="button">AI &amp; discovery</button>
  </div>
  <div class="pbody" id="pbody"></div>
</section>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="/backend.js"></script>
<script>
// Hybrid taxonomy (trading + trade/SaaS/fintech + business) and auto-classifier.
// Shared by the portal and the seed builder. Group 0 holds the trading niches.
var TAXONOMY = [
  { id: "trading", name: "Financial Markets & Trading", cats: [
    { id: "forex", name: "Forex Trading", kw: ["forex", "fx", "currency", "currencies", "cfd", "cfds", "eurusd", "online trading", "intraday", "marktanalyse", "trading plan", "trading-plan", "price action", "technical analysis"] },
    { id: "crypto", name: "Crypto & Web3 Trading", kw: ["crypto", "bitcoin", "blockchain", "web3", "defi", "stablecoin", "stablecoins", "digital assets", "tokenization", "tokenized", "rwa", "altcoin", "crypto exchanges"] },
    { id: "gold", name: "Gold & Precious Metals", kw: ["gold", "silver", "precious metals", "bullion", "commodities", "xauusd"] },
    { id: "signals", name: "Signal-Based Trading", kw: ["signal", "signals", "copy trading", "social trading", "trade alerts", "trading creators", "mirror trading"] },
    { id: "prop", name: "Prop Firm Trading", kw: ["prop", "prop firm", "prop firms", "prop traders", "proprietary trading", "funded trader", "funded account", "funded accounts", "trading challenge"] },
    { id: "algo", name: "Algorithmic & Quant Trading", kw: ["algorithmic", "algo", "quant", "quantitative", "automated trading", "trading bots", "expert advisor", "ai trading", "ai and quant"] }
  ]},
  { id: "tradesaas", name: "Trade, SaaS & Fintech", cats: [
    { id: "trade-automation", name: "Trade Automation", kw: ["trade automation", "trading automation", "tradetech", "rpa", "robotic process", "workflow automation"] },
    { id: "trade-services", name: "Trade Services", kw: ["trade finance", "export finance", "trade services", "letters of credit", "supply chain finance", "commodity finance", "gtr", "sibos", "cash management", "treasury", "correspondent banking"] },
    { id: "global-trade", name: "Global Trade & Import/Export", kw: ["import", "export", "trade fair", "canton fair", "international trade", "cross-border", "customs", "tariff", "sourcing", "overseas buyers", "exporters", "trade show", "logistics", "supply chain", "shipping", "container", "freight", "intralogistics"] },
    { id: "saas", name: "SaaS Products", kw: ["saas", "software as a service", "b2b software", "arr", "subscription", "go-to-market", "saastr", "product-led"] },
    { id: "fintech", name: "FinTech", kw: ["fintech", "payments", "banking", "money20/20", "digital banking", "open banking", "neobank", "broker", "brokers", "liquidity", "trading platform", "metatrader", "payment providers", "financial services"] },
    { id: "embedded-finance", name: "Embedded Finance", kw: ["embedded finance", "banking-as-a-service", "baas", "embedded payments", "super-app", "open finance", "api economy"] },
    { id: "regtech", name: "RegTech & Compliance", kw: ["regtech", "regulatory", "regulation", "compliance", "aml", "kyc", "regulator", "regulators", "dora", "governance"] }

        doc.querySelectorAll("item, entry").forEach(function (it) {
          var g = function (n) { var el = it.getElementsByTagName(n)[0]; return el ? (el.textContent || el.getAttribute("href") || "").trim() : ""; };
          out.push(mk({ title: g("title"), start: g("ev:startdate") || g("startDate") || g("pubDate") || g("published"), end: g("ev:enddate") || g("endDate"), url: g("link"), location: g("ev:location") || g("location"), description: g("description") || g("summary") || g("content") }));
        });
      }
    } catch (err) { return []; }
    return out.filter(Boolean);
  }
  function runsHTML() { return window.TED && window.TED.aiPanel ? window.TED.aiPanel(S.runs) : ""; }

  // ---------- Public interactions ----------
  $("#tabs").addEventListener("click", function (e) {
    var b = e.target.closest("[data-view]"); if (!b) return;
    S.view = b.dataset.view; try { localStorage.setItem("ted.view", S.view); } catch (x) {}
    renderAll();
  });
  $("#tabs").addEventListener("keydown", function (e) {
    if (e.key !== "ArrowRight" && e.key !== "ArrowLeft") return;
    var ids = TF.map(function (t) { return t.id; }).concat(["plan"]), i = ids.indexOf(S.view);
    S.view = ids[(i + (e.key === "ArrowRight" ? 1 : -1) + ids.length) % ids.length]; renderAll(); $('[data-view="' + S.view + '"]').focus();
  });
  var qT; $("#q").addEventListener("input", function (e) { clearTimeout(qT); qT = setTimeout(function () { S.q = e.target.value.trim(); renderTabs(); renderFilters(); renderMain(); }, 150); });
  $("#filters").addEventListener("change", function (e) {
    var t = e.target;
    if (t.dataset.k) { t.checked ? S[t.dataset.k].add(t.value) : S[t.dataset.k].delete(t.value); }
    else if (t.id === "f-free") S.freeOnly = t.checked;
    else if (t.id === "showPend") S.showPending = t.checked;
    var fid = t.id; renderTabs(); renderMain(); renderFilters(); var back = document.getElementById(fid); if (back) back.focus();
  });
  $("#filters").addEventListener("toggle", function (e) { if (e.target.dataset && e.target.dataset.s) open[e.target.dataset.s] = e.target.open; }, true);
  $("#filters").addEventListener("click", function (e) { if (e.target.id === "clearAll") { S.cats.clear(); S.formats.clear(); S.statuses.clear(); S.freeOnly = false; S.q = ""; $("#q").value = ""; renderAll(); } });
  $("#filterToggle").addEventListener("click", function () { var c = $("#filters").classList.toggle("collapsed"); this.setAttribute("aria-expanded", String(!c)); });
  $("#main").addEventListener("click", function (e) {
    var t = e.target.closest("button"); if (!t) return;
    if (t.dataset.mark) return toggleMark(t.dataset.id, t.dataset.mark);
    if (t.dataset.cat) { S.cats.add(t.dataset.cat); if (S.view === "plan") S.view = "180"; renderAll(); return; }
    if (t.dataset.detail) return openPanel("detail", t.dataset.detail);
    if (t.dataset.edit) { S.ptab = "edit"; S.editing = Object.assign({}, S.events.find(function (x) { return x.id === t.dataset.edit; })); openPanel("admin"); }
  });

  // ---------- Boot ----------
  S.plan = loadLocal();
  renderTabs(); renderFilters();
  (async function boot() {
    var c = window.TED;
    var db = c && c.use ? await c.use("db") : null, user = c && c.use ? await c.use("user") : null;
    S.db = db;
    if (user) { try { S.canEdit = !!(await user.canEdit()); } catch (e) {} try { S.uid = await user.id(); } catch (e) {} }
    $("#adminBtn").hidden = !S.canEdit;
    if (!db) { S.loaded = true; renderAll(); return; }
    db.collection("events").onSnapshot(function (snap) {
      S.events = snap.docs.map(function (d) { return Object.assign({}, d.data(), { id: d.id }); }).filter(function (x) { return x.title && x.start; });
      S.loaded = true; renderAll();
    }, function () { S.loaded = true; renderAll(); });
    if (S.canEdit) {
      db.collection("runs").orderBy("ranAt", "desc").limit(14).onSnapshot(function (snap) { S.runs = snap.docs.map(function (d) { return d.data(); }); if (S.panel === "admin" && S.ptab === "runs") renderAdmin(); }, function () {});
    }
    if (S.uid) {
      S.planDoc = db.doc("data/users/" + S.uid + "/plan");
      var first = true;
      S.planDoc.onSnapshot(function (snap) {
        var remote = (snap.exists && snap.data().items) || {};
        if (first) {
          first = false; S.planMode = "cloud";
          // merge anything saved locally before sign-in, then keep the account copy
          var local = loadLocal(), merged = Object.assign({}, local, remote);
          if (Object.keys(local).some(function (k) { return !remote[k]; })) {
            writing = writing.then(function () { return S.planDoc.set({ items: merged, updatedAt: new Date().toISOString() }); }).catch(function () { S.planMode = "local"; });
          }
          S.plan = merged; renderAll(); return;
        }
        if (!snap.metadata.hasPendingWrites) { S.plan = Object.assign({}, remote); renderAll(); }
      }, function () { S.planMode = "local"; renderAll(); });
    }
  })();
})();
</script>
